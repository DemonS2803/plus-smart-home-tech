
server:
  port: 8888


spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:config/telemetry/{application}
            - classpath:config/commerce/{application}
            - classpath:config/infra/{application}

eureka:
  client:
    register-with-eureka: true
    serviceUrl:

      defaultZone: http://localhost:8761/eureka/