server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/telemetry_analyzer
    username: dbuser
    password: 12345
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

analyzer:
  kafka:
    bootstrap-servers: localhost:9092

    snapshot-consumer:
      bootstrap-address: ${analyzer.kafka.bootstrap-servers}
      client-id: client.consumer.analyzer.snapshots
      group-id: group.snapshots
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.telemetry.serialization.avroschemas.deserialize.SensorsSnapshotAvroDeserializer
      enable-auto-commit: false
      topics:
        - telemetry.snapshots.v1

    hub-event-consumer:
      bootstrap-address: ${analyzer.kafka.bootstrap-servers}
      client-id: client.consumer.analyzer.hub
      group-id: group.hub-events
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.yandex.practicum.telemetry.serialization.avroschemas.deserialize.HubEventAvroDeserializer
      enable-auto-commit: false
      topics:
        - telemetry.hubs.v1


grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext
  server:
    port: 59093

