# Тестовая конфигурация: H2 вместо PostgreSQL, Feign fallback.
spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:order_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

# Feign: включить circuit breaker и логгирование
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 2000
        loggerLevel: basic

# Resilience4j для тестов: минимальные задержки
resilience4j:
  circuitbreaker:
    instances:
      inventory-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
      product-service:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      inventory-service:
        timeout-duration: 2s
      product-service:
        timeout-duration: 2s
